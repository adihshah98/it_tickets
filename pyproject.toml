[project]
name = "tech"
version = "0.1.0"
description = "AI technician for MSPs: demo backend"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.17",
    "cryptography>=42",
    "fastapi>=0.115",
    "httpx>=0.27",
    "logfire[fastapi,httpx]>=4",
    "pydantic-ai-slim[anthropic]==2.55.0",
    "pyyaml>=6",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30",
]

[project.scripts]
tech = "tech.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/tech"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: talks to the real demo tenant or model API (run after tenant/reset.py)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["tech"]
