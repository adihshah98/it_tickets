  # ---------------------------------------------------------------- two intents, injection

  - id: 14
    name: offboard Kevin and onboard his replacement
    from: tgarcia
    ticket: "Kevin Brooks is leaving today; his replacement Sam Ortiz starts Monday and should get exactly what Kevin had. Kevin's mail and groups to me please, laptop goes to Sam."
    setup: {last_sign_in: {kevin: "2026-10-09T15:30:00Z"}}
    triage: {intents: [user.offboard, user.onboard], entities: {new_user: {display_name: Sam Ortiz, department: Operations, start_date: "2026-10-12"}, peer_user_hint: Kevin, subject_user_hint: Kevin Brooks}}
    reads:
      - [users_search, {name: Kevin}]
      - [users_search, {name: Sam}]
      - [users_get, {user_id: "${kevin}"}]
      - [users_member_of, {user_id: "${kevin}"}]
      - [users_owned_objects, {user_id: "${kevin}"}]
      - [users_license_details, {user_id: "${kevin}"}]
      - [mailbox_settings, {user_id: "${kevin}"}]
      - [message_rules, {user_id: "${kevin}"}]
      - [subscribed_skus, {}]
      - [users_list, {}]
    plan:
      intent: user.offboard
      summary: Offboard Kevin Brooks to Taylor, and onboard Sam Ortiz with Kevin's access
      assumptions:
        - "mailbox_disposition: auto-reply and forward to Taylor"
        - "device_disposition: Kevin's laptop is reused for Sam"
        - "owned_resources_new_owner: Taylor"
        - "effective_time: now, on approval"
        - "peer: Kevin Brooks (Sam replaces him)"
        - "start_date: Monday 2026-10-12"
      confirm_on_approval:
        - {key: upn_format, question: "Use sam.ortiz@?", proposed: "sam.ortiz@${domain}", evidence: "recent hires use first.last@"}
      steps:
        - {id: disable, action: user.update, params: {userId: "${kevin}", accountEnabled: false}}
        - {id: revoke, action: sessions.revoke, depends_on: [disable], params: {userId: "${kevin}"}}
        - {id: auto_reply, action: mailbox.autoReply, depends_on: [disable],
           params: {userId: "${kevin}", message: "Kevin Brooks has left. Please contact Taylor Garcia."}}
        - {id: forward, action: mailbox.forwardRule, depends_on: [disable], params: {userId: "${kevin}", forwardTo: "tgarcia@${domain}"}}
        - {id: rm_field_ops, action: group.removeMember, depends_on: [disable], params: {groupId: "${field_ops}", userId: "${kevin}"}}
        - {id: rm_supervisors, action: group.removeMember, depends_on: [disable], params: {groupId: "${supervisors}", userId: "${kevin}"}}
        - {id: own_field_ops, action: group.addOwner, depends_on: [disable], params: {groupId: "${field_ops}", userId: "${tgarcia}"}}
        - {id: own_supervisors, action: group.addOwner, depends_on: [disable], params: {groupId: "${supervisors}", userId: "${tgarcia}"}}
        - {id: review, action: followup.schedule, depends_on: [disable],
           params: {kind: license.review, runAt: "2026-11-11T17:00:00Z", userId: "${kevin}"}}
        - id: create_user
          action: user.create
          params: {displayName: Sam Ortiz, userPrincipalName: "sam.ortiz@${domain}", mailNickname: sam.ortiz,
                   department: Operations, usageLocation: US}
        - {id: buy_seat, action: license.purchase, params: {skuId: "${sku}", skuPartNumber: O365_BUSINESS_ESSENTIALS, quantity: 1}}
        - {id: add_field_ops, action: group.addMember, depends_on: [create_user],
           params: {groupId: "${field_ops}", userId: "$ref:create_user.output.id", groupName: Field Operations}}
        - {id: add_supervisors, action: group.addMember, depends_on: [create_user],
           params: {groupId: "${supervisors}", userId: "$ref:create_user.output.id", groupName: Parking Supervisors}}
        - {id: assign_license, action: license.assign, depends_on: [create_user, buy_seat],
           params: {userId: "$ref:create_user.output.id", skuId: "${sku}"}}
        - {id: tap, action: tap.create, depends_on: [create_user], params: {userId: "$ref:create_user.output.id"}}
        - {id: send_link, action: link.sendOneTime, depends_on: [tap],
           params: {to: "tgarcia@${domain}", userId: "$ref:create_user.output.id", tap: "$ref:tap.output.tap"}}
      needs_technician: *offboard_needs_technician
    then: [{approve: tgarcia, answers: {upn_format: sam.ortiz}}]
    expect:
      intents: [user.offboard, user.onboard]
      lint: ok
      after_start: AWAITING_APPROVAL
      state: DONE
      dod:
        ok: true
        probes: [account_disabled, sessions_revoked, removed_from_groups, ownership_transferred, followup_scheduled,
                 user_exists, user_has_sku, user_in_groups, tap_active, message_sent, needs_technician_listed]

